name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # geonix41 のベンダーブロブ。リポジトリには置けないので毎回取りに行くが、
      # 中身が変わるのは配布物が差し替わったときだけなのでキャッシュが効く。
      # 落とすのは 97KB の2ファイルだけ (取得スクリプトのコメント参照)
      - name: Cache vendor blob
        uses: actions/cache@v4
        with:
          path: vendor
          key: rdr-lib-${{ hashFiles('scripts/geonix41/fetch-vendor-blob.py') }}
      # QMK は compose.agent.yaml のコンテナの中で動かす (test.yml と同じ)
      - name: Start QMK container
        run: docker compose -f compose.agent.yaml up -d --wait
      - name: Put qmk on PATH
        run: echo "$GITHUB_WORKSPACE/scripts/bin" >> "$GITHUB_PATH"
      # リリースするファームウェアは lint を通したものに限る
      - name: Run lint
        run: bash scripts/lint.sh
      - name: Build firmware
        run: bash scripts/build.sh
      # geonix41 はコアにパッチを当てるので、使い捨てのコンテナで別に作る
      - name: Build geonix41
        run: bash scripts/geonix41/build.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windmill-firmware
          path: |
            output/*.hex
            output/*.bin
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windmill-firmware
          path: output
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/windmill_technik.hex
            output/windmill_ymd40.hex
            output/windmill_minipeg48.hex
            output/windmill_geonix41.bin
          fail_on_unmatched_files: true
