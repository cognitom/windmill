name: Claude

# issue に claude ラベルを付けると Claude が実装してPRを出す。
# セットアップと運用は docs/claude-bot.md を参照。

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# 既定では何も渡さず、必要な権限はジョブ側で付ける
permissions: {}

jobs:
  # 本番ルート。調査 → 実装 → テスト → PR まで通しでやらせる。
  # 手強い issue は claude-opus ラベルのほうを付けてモデルを上げる
  labeled:
    name: Work on labeled issue
    # 起動できるのはリポジトリの持ち主だけ (CLAUDE_USER で上書きできる)。
    # 他人のラベル付けやコメントでは動かないので、使う枠は自分の操作ぶんに収まる
    if: >-
      (github.event.label.name == 'claude' ||
       github.event.label.name == 'claude-opus') &&
      github.actor == (vars.CLAUDE_USER || github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # 同じ issue で二重に走らせない。走行中のものは潰さない
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # Claude GitHub App のトークンをOIDCで受け取る
      actions: read # CI (Build ワークフロー) の結果を読むため
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # コミットログの書き方に合わせさせる

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # issue に進捗コメントを1本立てて、そこを更新していく
          track_progress: true
          prompt: |
            issue #${{ github.event.issue.number }} を担当してほしい。

            1. まず CLAUDE.md を読む。このリポジトリの構成と守ってほしいことが書いてある
            2. issue の本文とコメントを読み、関連するコードとドキュメントを調べる
            3. 実装したら `bash scripts/lint.sh` と `bash scripts/test.sh` を通す。
               Dockerイメージのビルドから走るので数分かかる。落ちたまま出さないこと
            4. ブランチへコミットする
            5. **`mcp__github__create_pull_request` を呼んでPRを作る。**
               action の既定の案内は「PR作成用のリンクを出す」で止まるが、
               それでは終わりにしない。本文には issue への参照を入れる
            6. やったことを issue のコメントに返す。ただし、PRに書いたことは
               そちらに書くので、issue には「PRを作った」だけでよい

            キー配置の好みや設計方針など、判断が割れそうなところは勝手に決めない。
            issue にコメントで質問して、そこで止まること。
          claude_args: |
            --model ${{ github.event.label.name == 'claude-opus' && 'claude-opus-5' || 'claude-sonnet-5' }}
            --max-turns 60
            --allowedTools "Bash(bash scripts/lint.sh),Bash(bash scripts/test.sh),mcp__github__create_pull_request"

      # action の後処理は「PRがもう在るか」をAPIで確かめず、コメント本文に
      # compare URL が無ければ「Create PR」リンクを足す。PRを作らせている今の
      # 使い方だと必ず余る。しかもURLの抜き出しに使う正規表現が
      # `[Claude Code](https://claude.ai/code)` のカッコで切れてリンクが壊れる。
      # 直せるのは向こうなので、こちらは出てきたぶんを剥がす
      - name: Tidy up the tracking comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]" and (.body | test("Create PR ➔")))] | last | .id // empty' \
            | tail -n1)
          if [ -z "$id" ]; then
            echo "剥がすリンクは無し"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body > "$RUNNER_TEMP/body.md"
          python3 - "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/patch.json" <<'PY'
          import json, re, sys

          src, dst = sys.argv[1], sys.argv[2]
          with open(src, encoding="utf-8") as f:
              body = f.read()
          # ヘッダー行の末尾に付く ` • [Create PR ➔](...)` だけを落とす
          body = re.sub(r" • \[Create PR ➔\]\(.*$", "", body, flags=re.M)
          with open(dst, "w", encoding="utf-8") as f:
              json.dump({"body": body}, f)
          PY
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input "$RUNNER_TEMP/patch.json" --silent
          echo "コメント $id から Create PR リンクを剥がした"

  # 既存の issue / PR で @claude と呼んだときの受け答え。
  # 追加指示やレビュー対応はこちらに乗る
  mentioned:
    name: Respond to @claude
    # fork のPRでは動かさない。チェックアウトするのが第三者のコードになり、
    # 許可した scripts/test.sh も向こうの中身が走ってしまうため
    # (issue_comment のペイロードには fork かどうかが載らないので、
    #  PRの会話タブから呼ぶぶんは docs の運用ルールで補う)
    if: >-
      github.event_name != 'issues' &&
      github.actor == (vars.CLAUDE_USER || github.repository_owner) &&
      contains(github.event.comment.body, '@claude') &&
      (github.event_name != 'pull_request_review_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model ${{ contains(github.event.comment.body, '@claude opus') && 'claude-opus-5' || 'claude-sonnet-5' }}
            --max-turns 60
            --allowedTools "Bash(bash scripts/lint.sh),Bash(bash scripts/test.sh),mcp__github__create_pull_request"
