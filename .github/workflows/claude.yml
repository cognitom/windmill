name: Claude

# issue に claude ラベルを付けると Claude が実装してPRを出す。
# セットアップと運用は docs/claude-bot.md を参照。

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# 既定では何も渡さず、必要な権限はジョブ側で付ける
permissions: {}

jobs:
  # 本番ルート。調査 → 実装 → テスト → PR まで通しでやらせる
  labeled:
    name: Work on labeled issue
    # 起動できるのはリポジトリの持ち主だけ (CLAUDE_USER で上書きできる)。
    # 他人のラベル付けやコメントでは動かないので、使う枠は自分の操作ぶんに収まる
    if: >-
      github.event.label.name == 'claude' &&
      github.actor == (vars.CLAUDE_USER || github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # 同じ issue で二重に走らせない。走行中のものは潰さない
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # Claude GitHub App のトークンをOIDCで受け取る
      actions: read # CI (Build ワークフロー) の結果を読むため
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # コミットログの書き方に合わせさせる

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # issue に進捗コメントを1本立てて、そこを更新していく
          track_progress: true
          prompt: |
            issue #${{ github.event.issue.number }} を担当してほしい。

            1. まず CLAUDE.md を読む。このリポジトリの構成と守ってほしいことが書いてある
            2. issue の本文とコメントを読み、関連するコードとドキュメントを調べる
            3. 実装したら `bash scripts/test.sh` でユニットテストを通す。
               Dockerイメージのビルドから走るので数分かかる。落ちたまま出さないこと
            4. ブランチへコミットしてPRを作り、やったことを issue に返す

            ファームウェアのビルド (`scripts/build.sh`) はこの場で走らせなくてよい。
            PRを作れば Build ワークフローが4機種ぶんコンパイルする。

            キー配置の好みや設計方針など、判断が割れそうなところは勝手に決めない。
            issue にコメントで質問して、そこで止まること。
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --allowedTools "Bash(bash scripts/test.sh)"

  # 既存の issue / PR で @claude と呼んだときの受け答え。
  # 追加指示やレビュー対応はこちらに乗る
  mentioned:
    name: Respond to @claude
    if: >-
      github.event_name != 'issues' &&
      github.actor == (vars.CLAUDE_USER || github.repository_owner) &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --allowedTools "Bash(bash scripts/test.sh)"
